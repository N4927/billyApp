server {
    listen 80;
    server_name _;

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }
}
