# ==============================================================================
#  DEPENDENCY VERSION CATALOG
# ==============================================================================
#  Centralized management of dependencies and plugin versions.
#  Ensures consistency across all modules in the project.

[versions]
# --- ANDROID & KOTLIN CORE ---
agp = "8.5.0"            # Android Gradle Plugin (Stable)
kotlin = "2.0.0"         # Kotlin Language (K2 Compiler)

# --- ANDROID SDK CONFIGURATION ---
# Target SDK 34 ensures compatibility with Android 14 privacy changes.
android-compileSdk = "34"
android-minSdk = "24"    # Min SDK 24 covers ~96% of active devices.
android-targetSdk = "34"

# --- SUPPORT LIBRARIES ---
androidx-activity = "1.9.0"
androidx-appcompat = "1.7.0"
androidx-core = "1.13.1"
composeMultiplatform = "1.6.11"
junit = "4.13.2"
spotless = "6.25.0"

# --- BILLY APP TECHNOLOGY STACK ---
# Versions aligned with Kotlin 2.0.0 ecosystem.
ktor = "2.3.12"          # Networking: Asynchronous HTTP Client
sqldelight = "2.0.2"     # Persistence: Type-safe SQL Wrapper
datetime = "0.6.0"       # Utilities: Multiplatform Date/Time
coroutines = "1.8.1"     # Concurrency: Structured Concurrency
serialization = "1.7.0"  # Data: JSON Parsing & Encoding
kover = "0.9.0-RC"       # Quality: Code Coverage Tool
kermit = "2.0.3"         # Logging: Multiplatform Logging

[libraries]
# --- TESTING INFRASTRUCTURE ---
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# --- NETWORKING (Ktor) ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" } # iOS Engine (NSURLSession)
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" } # Android Engine (OkHttp)
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }

# --- PERSISTENCE (SQLDelight) ---
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" } # JVM Driver for Tests

# --- UTILS ---
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# --- LOGGING (Kermit) ---
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# ADDITIONAL PLUGINS
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }