name: Sync README feature index

on:
  push:
    branches:
      - reports
  workflow_dispatch:

permissions:
  contents: write   # ⬅️ QUESTA È LA PARTE IMPORTANTE

jobs:
  sync-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README feature index
        run: |
          python .github/scripts/update_readme.py

      - name: Commit and push README if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            echo "Changes detected in README.md, committing..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(docs): sync feature index [skip ci]"
            git push
          else
            echo "README.md already up to date."
          fi
