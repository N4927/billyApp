name: KMM - Continuous Integration

on:
  push:
    branches: [ "stable/kmm", "dev/kmm" ]
  pull_request:
    branches: [ "stable/kmm", "dev/kmm" ]

jobs:
  # JOB 1: STATIC ANALYSIS (Fast Fail)
  # Enforces code style and formatting standards before proceeding.
  lint:
    name: 🧹 Code Style (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Run Spotless Check
        run: ./gradlew :shared:spotlessCheck

  # JOB 2: UNIT TESTING (Parallel Execution)
  # Validates business logic correctness across platforms.
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      # Executes Android (JVM) and Common unit tests.
      - name: Run Tests
        run: ./gradlew :shared:testDebugUnitTest

  # JOB 3: COMPILATION VERIFICATION (Cross-Platform)
  # Ensures the SDK compiles successfully for both Android and iOS targets.
  build-check:
    name: 🏗️ Compilation Check
    runs-on: macos-latest # macOS is required to verify iOS compilation.
    needs: [lint, test] # Depends on successful completion of Lint and Test jobs.
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Android Build
        run: ./gradlew :shared:assembleDebug

      - name: Verify iOS Framework Build
        run: ./gradlew :shared:assembleBillySDKXCFramework