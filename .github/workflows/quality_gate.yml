name: 🛡️ Quality Gate

on:
  push:
    branches: [ "stable/kmm", "dev/kmm" ]
  pull_request:
    branches: [ "stable/kmm", "dev/kmm" ]

jobs:
  # JOB 1: LINTING (Veloce)
  lint:
    name: 🧹 Code Style (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Run Spotless Check
        run: ./gradlew :shared:spotlessCheck

  # JOB 2: TESTING (Parallelo)
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      # Esegue i test unitari Android (JVM) e Comuni
      - name: Run Tests
        run: ./gradlew :shared:testDebugUnitTest

  # JOB 3: BUILD CHECK (Verifica che compili su tutte le piattaforme)
  build-check:
    name: 🏗️ Compilation Check
    runs-on: macos-latest # Serve Mac per verificare la compilazione iOS
    needs: [lint, test] # Parte solo se lint e test passano
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Android Build
        run: ./gradlew :shared:assembleDebug

      - name: Verify iOS Framework Build
        run: ./gradlew :shared:assembleBillySDKXCFramework