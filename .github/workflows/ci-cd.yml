name: "BillyApp API: Production Release Pipeline"

on:
  push:
    branches: [ "dev/server", "stable/server" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/badges/**'
  pull_request:
    branches: [ "dev/server", "stable/server" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

# [Optimization] Cancel previous runs on the same branch to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global Environment Variables
env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.0.0"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ===================================================
  # STAGE 1: CONTINUOUS INTEGRATION (Quality & Test)
  # ===================================================
  quality-assurance:
    name: 🛡️ Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10 # [Safety] Prevent hung jobs from consuming minutes
    permissions:
      contents: write # Required to commit the coverage badge

    services:
      # Ephemeral Database for Integration Tests
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ble_db
          POSTGRES_USER: ble_user
          POSTGRES_PASSWORD: ble_password
        ports:
          - 5432:5432
        # Healthcheck: Ensure DB is ready before tests start
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Ephemeral Cache for Integration Tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: 💾 Load Cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: ⬇️ Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with dev

      - name: 🎨 Linting (Black)
        run: poetry run black --check src tests

      - name: 🧐 Code Quality (Flake8)
        # Enforce strict quality gates. F82 = undefined name, E9 = syntax error.
        run: poetry run flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 Run Tests (Pytest)
        env:
          DEBUG: 1
          SECRET_KEY: "ci-secret-key-safe-for-testing"
          # Services are exposed on localhost in GitHub Actions
          DATABASE_URL: "postgres://ble_user:ble_password@localhost:5432/ble_db"
          REDIS_URL: "redis://localhost:6379/1"
          PYTHONPATH: "src"
          DJANGO_SETTINGS_MODULE: "config.settings"
        run: |
          # Run tests with coverage report generation
          poetry run pytest --cov=src --cov-report=xml

      - name: 📛 Generate Coverage Badge
        if: success() # Only generate if tests pass
        run: |
          pip install genbadge[coverage]
          mkdir -p .github/badges
          genbadge coverage -i coverage.xml -o .github/badges/coverage.svg

      - name: 💾 Commit Badge
        uses: stefanzweifel/git-auto-commit-action@v5
        if: success() && github.event_name == 'push'
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: .github/badges/coverage.svg

  # ===================================================
  # STAGE 2: CONTINUOUS DELIVERY (Build & Publish)
  # ===================================================
  build-and-publish:
    name: 🐳 Build & Push Docker Image
    needs: quality-assurance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable/server'

    permissions:
      contents: read
      packages: write # Required to push to GHCR
      security-events: write # Required for Trivy results

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Normalize Image Name
        run: echo "IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            latest

      - name: 🚀 Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # [Security] Scan the built image for vulnerabilities
      - name: 🛡️ Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '0' # Don't fail build on vuln yet, just report
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
