name: BillyApp Enterprise Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

# Variabili d'ambiente globali per la pipeline
env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.7.1"
  IMAGE_NAME: ghcr.io/${{ github.repository }} # Usa GitHub Registry

jobs:
  # ===================================================
  # STAGE 1: CONTINUOUS INTEGRATION (Quality & Test)
  # ===================================================
  quality-assurance:
    name: 🛡️ Quality & Security
    runs-on: ubuntu-latest

    services:
      # Database effimero per i test di integrazione
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ble_db
          POSTGRES_USER: ble_user
          POSTGRES_PASSWORD: ble_password
        ports:
          - 5432:5432
        # Healthcheck: La pipeline aspetta che il DB sia pronto
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Cache effimera per i test di integrazione
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: 💾 Load Cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: ⬇️ Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: 🎨 Linting (Black)
        run: poetry run black --check src tests

      - name: 🧐 Code Quality (Flake8)
        # Ignoriamo errori non critici o conflitti con Black
        run: poetry run flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 Run Tests (Pytest)
        env:
          DEBUG: 1
          SECRET_KEY: "ci-secret-key-safe-for-testing"
          # Nota: In GitHub Actions i service sono su localhost
          DATABASE_URL: "postgres://ble_user:ble_password@localhost:5432/ble_db"
          REDIS_URL: "redis://localhost:6379/1"
          PYTHONPATH: "src"
          DJANGO_SETTINGS_MODULE: "config.settings"
        run: |
          poetry run pytest --cov=src --cov-report=xml

      # Opzionale: Carica il report di copertura su Codecov (se hai un account)
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v3

  # ===================================================
  # STAGE 2: CONTINUOUS DELIVERY (Build & Publish)
  # ===================================================
  build-and-publish:
    name: 🐳 Build & Push Docker Image
    needs: quality-assurance # Parte solo se i test passano
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Solo su merge a main

    permissions:
      contents: read
      packages: write # Permesso per scrivere su GHCR

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            latest

      - name: 🚀 Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
