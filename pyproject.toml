[project]
name = "app-backend"
version = "0.1.0"
description = "API Backend"
authors = [
    {name = "BillyApp"}
]
readme = "README.md"
dependencies = [
    "django (>=5.2.8,<6.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "cryptography (>=46.0.3,<47.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "whitenoise (>=6.11.0,<7.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "celery (>=5.5.3,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
[dependency-groups]
dev = [
    "black (>=25.11.0,<26.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pre-commit (>=4.5.0,<5.0.0)",
    "locust (>=2.42.5,<3.0.0)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",       # Codice generato da Django
    "*/tests/*",            # Non testiamo i test
    "*/__init__.py",        # File vuoti
    "src/manage.py",        # Entry point amministrativo
    "src/config/wsgi.py",   # Entry point server
    "src/config/asgi.py",   # Entry point server
    "src/apps/*/admin.py",  # Configurazione admin (opzionale, spesso si esclude)
]

[tool.coverage.report]
show_missing = true
fail_under = 80             # La CI fallirà se la coverage è sotto l'80% (Standard Corporate)
