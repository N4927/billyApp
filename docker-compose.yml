services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env # Legge dal file
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: .
    # SCALING VERTICALE: Aumentiamo worker (4) e thread (4) per gestire concorrenza
    command: >
      sh -c "python src/manage.py collectstatic --noinput &&
             python src/manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4 --chdir src"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file: .env # Legge DEBUG=0 da qui
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    command: celery -A config worker -l info --concurrency=4
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - db
      - redis
      - backend

  celery_beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  static_volume:
