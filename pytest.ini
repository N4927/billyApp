[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = src
# Discovery dei test più veloce
testpaths = tests
python_files = test_*.py
# Opzioni Enterprise:
# -v: Verbose
# --reuse-db: Non ricrea il DB da zero ogni volta (velocissimo in locale)
# --nomigrations: Usa il modello in memoria invece di applicare le migrazioni SQL (boost performance)
addopts = -v -p no:warnings --reuse-db --nomigrations
markers =
    unit: Test veloci che non toccano il DB o IO
    integration: Test che coinvolgono DB, API o componenti multipli
