name: BillyApp
options:
  bundleIdPrefix: com.billyapp
  xcodeVersion: 17.0
  deploymentTarget:
    iOS: 16.0
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true 

configs:
  Debug: debug
  Release: release

targets:
  BillyApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    
    dependencies:
      - framework: Frameworks/BillySDK.xcframework
        embed: true
        codeSign: true
      - sdk: libsqlite3.tbd

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billyapp.ios
        INFOPLIST_FILE: Resources/Info.plist
        
        SWIFT_VERSION: 5.0
        
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: "TUO_TEAM_ID" # Scommenta quando hai l'account Apple Dev
        
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          SWIFT_COMPILATION_MODE: wholemodule # Ottimizzazione massima
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym # Serve per Sentry/Crashlytics